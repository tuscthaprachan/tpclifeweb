 ไม่ว่าจะต้องการอะไรหรือเมื่อใด\"},\"ui.aboutWhyInvite\":{\"en\":\"This site belongs to the students it serves, and it will keep growing as we learn what you need. If something is missing, unclear or wrong, tell us.\",\"th\":\"เว็บไซต์นี้เป็นของนักศึกษาที่ใช้งาน และจะเติบโตต่อไปตามสิ่งที่พวกคุณต้องการ หากมีอะไรขาดหาย ไม่ชัดเจน หรือไม่ถูกต้อง บอกเราได้เสมอ\"},\"ui.aboutWhyHeading\":{\"en\":\"Why we made it\",\"th\":\"ทำไมเราจึงสร้างเว็บไซต์นี้\"},\"ui.aboutWhyProblem\":{\"en\":\"Life at Tha Prachan is full of things worth knowing: where to eat, how to get around, which form to fill in, what is on this week, and who to ask when something goes wrong. Too often that information is scattered across posts, chats and noticeboards, and finding it depends on knowing the right person.\",\"th\":\"ชีวิตที่ท่าพระจันทร์มีเรื่องที่ควรรู้มากมาย ทั้งกินอะไรดี เดินทางอย่างไร ต้องกรอกแบบฟอร์มไหน สัปดาห์นี้มีกิจกรรมอะไร และเมื่อมีปัญหาควรถามใคร แต่ข้อมูลเหล่านี้มักกระจัดกระจายอยู่ตามโพสต์ แชต และบอร์ดประกาศ จนการหาข้อมูลให้เจอขึ้นอยู่กับว่ารู้จักคนที่ใช่หรือไม่\"},\"ui.aboutWhyTogether\":{\"en\":\"We believe the two bodies serve students better together than apart. Building one site between us means no student has to know which body looks after what. They only need to know to come here.\",\"th\":\"เราเชื่อว่าสององค์กรทำงานร่วมกันได้ดีกว่าแยกกันทำ การสร้างเว็บไซต์นี้ด้วยกันทำให้นักศึกษาไม่ต้องรู้ว่าเรื่องไหนเป็นงานขององค์กรใด เพียงแค่รู้ว่าต้องมาที่นี่\"},\"ui.aboutMadeTogether\":{\"en\":\"This website is made together by TUSU Tha Prachan and TUSC Tha Prachan.\",\"th\":\"เว็บไซต์นี้สร้างขึ้นร่วมกันโดย อมธ. ท่าพระจันทร์ และสภานักศึกษา ท่าพระจันทร์\"}}};e:[\"$\",\"html\",null,{\"lang\":\"en-GB\",\"className\":\"Sc3cqG_variable Dh32Da_variable xOt-Uq_variable\",\"suppressHydrationWarning\":true,\"children\":[[\"$\",\"head\",null,{\"children\":[[\"$\",\"script\",null,{\"dangerouslySetInnerHTML\":{\"__html\":\"(function(){try{var m=document.cookie.match(/(?:^|; )(?:trytpc_theme|tpclife_theme
