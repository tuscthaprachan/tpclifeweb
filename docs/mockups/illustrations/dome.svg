<title id="tu-dome-title">Thammasat University Dome Building</title>
<desc id="tu-dome-desc">A flat vector illustration proportioned to the reference photograph: a tall narrow spire, flared lower roof, tall cream facade, arched ground floor, offset seated statue and asymmetrical trees. Transparent background. Thai flag colours: #A51931, #F4F5F8 and #2D2A4A.</desc>
