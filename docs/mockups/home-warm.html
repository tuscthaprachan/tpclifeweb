<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home mock-up, warm direction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --surface: #ffffff;
  --surface-alt: #fef8f4;
  --ink-900: #1f1a1c;
  --ink-600: #554f51;
  --ink-on-fill: #1f1a1c;
  --line: #e2dcde;
  --action: #613f87;
  --action-hover: #42295e;
  --on-action: #ffffff;
  --accent: #843a01;
  --fill-transport: #e7935b;
  --fill-activity: #c293e5;
  --fill-governance: #998fe8;
  --success: #1d6b3a;
  --success-soft: #dcefe2;
  --neutral-soft: #ece9ea;
  --band: linear-gradient(135deg, #fbe4d7 0%, #f8dccf 35%, #f0e4f9 100%);
  --search-ring: #868082;
  --focus-fill: #ffbf47;
  --radius-block: 16px;
  --radius-pill: 999px;
  --target: 44px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --surface: #1a1220;
  --surface-alt: #251a2d;
  --ink-900: #f1ebf3;
  --ink-600: #c3b8c8;
  --line: #3a2d44;
  --action: #d4b8f5;
  --action-hover: #e6d6fa;
  --on-action: #1a1220;
  --accent: #f0ad82;
  --fill-transport: #d98650;
  --fill-activity: #b585d9;
  --fill-governance: #8c82da;
  --success: #8fd3a6;
  --success-soft: #1f3a29;
  --neutral-soft: #33293b;
  --band: radial-gradient(120% 90% at 0% 0%, rgba(217,134,80,.42) 0%, rgba(217,134,80,0) 60%), radial-gradient(110% 100% at 100% 100%, rgba(181,133,217,.40) 0%, rgba(181,133,217,0) 65%), #241830;
  --search-ring: #8d7f97;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--surface);
  color: var(--ink-900);
  font-family: Lexend, Sarabun, system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.6;
}
:lang(th) { font-family: Sarabun, Lexend, system-ui, sans-serif; font-size: 18px; line-height: 1.75; }
h1, h2, h3 { margin: 0; line-height: 1.25; }
:lang(th) h1, :lang(th) h2, :lang(th) h3 { line-height: 1.4; }
a { color: var(--action); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible, input:focus-visible {
  outline: 3px solid var(--focus-fill);
  outline-offset: 0;
  box-shadow: 0 0 0 6px var(--ink-900);
}
.wrap { padding-inline: 16px; max-width: 1180px; margin-inline: auto; }
.press { transition: transform 150ms cubic-bezier(.2,0,.2,1); }
.press:active { transform: translateY(1px) scale(.98); }
@media (prefers-reduced-motion: reduce) { .press { transition: none; } .press:active { transform: none; } }

.phase { font-size: .875rem; padding-block: 6px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
.phase .tag { background: var(--fill-activity); color: var(--ink-on-fill); font-weight: 700; border-radius: var(--radius-pill); padding: 0 10px; }
.header { display: flex; align-items: center; justify-content: space-between; min-height: 56px; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; z-index: 10; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; text-decoration: none; color: var(--ink-900); min-height: var(--target); }
.brand .mark { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, var(--fill-transport), var(--fill-activity)); }
.menu { min-height: var(--target); padding-inline: 16px; border-radius: var(--radius-pill); border: 1px solid var(--search-ring); background: var(--surface); color: var(--ink-900); font: inherit; font-weight: 600; }

.band { background: var(--band); border-radius: 0 0 28px 28px; padding-block: 16px 20px; }
.band-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.band h1 { font-size: 1.6rem; font-weight: 700; max-width: 15ch; }
:lang(th) .band h1 { font-size: 1.6rem; max-width: 12em; }
.band .dome { flex: none; width: 96px; margin-block: -8px -48px; }
.band .dome svg { display: block; width: 100%; height: auto; }
.band .search { position: relative; }
.search { margin-top: 8px; }
.search label { display: block; font-weight: 700; }
.search .hint { margin: 0 0 8px; color: var(--ink-600); font-size: .875rem; }
:lang(th) .search .hint { font-size: 1rem; }
.search-row { display: flex; background: var(--surface); border: 2px solid var(--search-ring); border-radius: var(--radius-pill); padding: 4px; gap: 4px; }
.search-row:focus-within { outline: 3px solid var(--focus-fill); box-shadow: 0 0 0 6px var(--ink-900); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink-900); font: inherit; padding-inline: 14px; min-height: 48px; border-radius: var(--radius-pill); }
.search input:focus-visible { outline: none; box-shadow: none; }
.search button { border: 0; background: var(--action); color: var(--on-action); font: inherit; font-weight: 700; border-radius: var(--radius-pill); padding-inline: 20px; min-height: 48px; }

section { margin-top: 24px; }
.band + .wrap > .grid2:first-child > section:first-child { margin-top: 20px; }
.bar { border-radius: var(--radius-block); padding: 10px 16px; color: var(--ink-on-fill); font-size: 1.25rem; font-weight: 700; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
:lang(th) .bar { font-size: 1.35rem; }
.bar.transport { background: var(--fill-transport); }
.bar.activity { background: var(--fill-activity); }
.bar.governance { background: var(--fill-governance); }
.bar.action { background: var(--action); color: var(--on-action); }

.sched { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; margin: 10px 0 0; color: var(--ink-600); font-size: .875rem; }
:lang(th) .sched { font-size: 1rem; }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: var(--radius-pill); padding: 0 10px; font-weight: 600; font-size: .875rem; white-space: nowrap; }
:lang(th) .pill { font-size: .95rem; }
.pill.transport { background: var(--fill-transport); color: var(--ink-on-fill); }
.pill.open { background: var(--success-soft); color: var(--success); }
.pill.closed { background: var(--neutral-soft); color: var(--ink-900); }
.pill.tusu { background: var(--fill-governance); color: var(--ink-on-fill); }
.pill.tusc { background: var(--fill-activity); color: var(--ink-on-fill); }

dl.today { margin: 8px 0 0; }
dl.today > div { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 4px; border-bottom: 1px solid var(--line); align-items: baseline; }
dl.today dt { font-weight: 700; }
dl.today dt a { color: var(--ink-900); text-decoration: none; }
dl.today dt a:hover { text-decoration: underline; }
dl.today dd.time { margin: 0; }
dl.today dd:not(.time) { margin: 0; grid-column: 1 / -1; color: var(--ink-600); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
dl.today .time { grid-column: 2; grid-row: 1; font-size: 1.5rem; font-weight: 700; color: var(--ink-900); font-variant-numeric: tabular-nums; }
.more { display: inline-flex; align-items: center; min-height: var(--target); font-weight: 600; }

ul.tasks { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
ul.tasks a { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; min-height: 64px; padding: 10px 10px 10px 16px; background: var(--surface-alt); border-radius: var(--radius-block); text-decoration: none; }
ul.tasks .label { display: block; font-weight: 700; color: var(--action); }
ul.tasks .scent { display: block; color: var(--ink-600); font-size: .875rem; line-height: 1.45; }
:lang(th) ul.tasks .scent { font-size: 1rem; line-height: 1.6; }
ul.tasks .arrow { width: 36px; height: 36px; border-radius: 50%; background: var(--action); display: grid; place-items: center; }
ul.tasks .arrow svg { width: 18px; height: 18px; stroke: var(--on-action); }
ul.tasks a:hover .label { text-decoration: underline; }

h3.sub { font-size: 1.1rem; margin-top: 16px; }
ul.items { list-style: none; margin: 4px 0 0; padding: 0; }
ul.items li { display: grid; grid-template-columns: 56px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.date { width: 56px; height: 60px; border-radius: 14px; background: var(--fill-activity); color: var(--ink-on-fill); display: grid; place-items: center; text-align: center; font-weight: 700; }
.date, .date * { line-height: 1.2 !important; }
.date b { display: block; font-size: 1.35rem; }
.date span { font-size: .8rem; }
ul.items a { font-weight: 700; }
ul.items .meta { display: block; color: var(--ink-600); font-size: .875rem; }
:lang(th) ul.items .meta { font-size: 1rem; }
ul.news li { grid-template-columns: 1fr; }
ul.updates li { grid-template-columns: 1fr; }
.links { display: flex; flex-wrap: wrap; gap: 0 20px; }

.empty { margin-top: 12px; background: var(--surface-alt); border-radius: var(--radius-block); padding: 20px 16px; display: grid; justify-items: center; text-align: center; gap: 6px; }
.empty svg { width: 120px; height: 84px; }
.empty p { margin: 0; color: var(--ink-600); }
.empty strong { font-size: 1.1rem; }
.empty .btn { display: inline-flex; align-items: center; min-height: var(--target); padding-inline: 18px; border-radius: var(--radius-pill); border: 2px solid var(--action); font-weight: 700; text-decoration: none; }

footer { margin-top: 40px; background: var(--surface-alt); padding-block: 24px 32px; border-radius: 28px 28px 0 0; }
footer h2 { font-size: 1.2rem; }
footer p { margin: 6px 0 10px; color: var(--ink-600); }
footer ul { list-style: none; padding: 0; margin: 0; }
footer li a { display: inline-flex; align-items: center; min-height: var(--target); }

@media (min-width: 48rem) {
  .band h1 { font-size: 2.2rem; max-width: none; }
  .band .dome { width: 180px; margin-bottom: -60px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 32px; align-items: start; }
}
</style>
</head>
